<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#051410"><title>Избранное — ТИК</title><link rel="icon" href="https://i.ibb.co/fd99r06X/TIK-logo-transparent.png"><style>
:root{--bg:#051410;--panel:#10271f;--line:rgba(255,255,255,.13);--neon:#00ff8c;--gold:#d4b87a;--muted:#a8bdb5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 0%,rgba(0,255,140,.1),transparent 40%),#051410;color:#fff;font:15px/1.5 Inter,system-ui,-apple-system,sans-serif;padding-bottom:80px}a{color:inherit;text-decoration:none}button,input,select{font:inherit}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.header{position:sticky;top:0;z-index:5;background:rgba(5,20,16,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.head{height:76px;display:flex;align-items:center;gap:24px}.brand img{width:58px;height:58px;object-fit:contain}.nav{display:flex;gap:20px;align-items:center;flex:1;font-size:13px}.nav a:hover,.nav a.active{color:var(--neon)}.head-actions{display:flex;gap:9px;font-size:12px}.head-actions a{border:1px solid var(--line);border-radius:12px;padding:10px 12px}.head-actions a.active{border-color:var(--neon);color:var(--neon)}main{min-height:60vh;padding:38px 0 54px}h1{font-size:clamp(32px,5vw,48px);line-height:1.05;letter-spacing:-.05em;margin:0 0 10px}h1 em{color:var(--gold);font-style:normal}.intro{color:var(--muted);margin:0 0 26px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.toolbar input,.toolbar select,.field{background:#10271f;color:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}.toolbar input{flex:1;min-width:190px}.toolbar select{min-width:160px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.product{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:rgba(26,46,40,.72);min-width:0}.product img{display:block;width:100%;aspect-ratio:4/4.5;object-fit:cover;background:#13261e}.pinfo{padding:12px}.cat{font-size:11px;color:var(--muted)}.name{font-size:13px;font-weight:650;min-height:40px;margin:5px 0 10px}.price{font-weight:800;color:var(--gold);margin-bottom:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--neon);color:#03150d;font-weight:750;cursor:pointer}.btn.secondary{background:transparent;color:#fff;border:1px solid var(--line)}.btn.danger{background:transparent;color:#ff9c9c;border:1px solid rgba(255,120,120,.3)}.heart{border:1px solid var(--line);background:transparent;color:var(--neon);border-radius:10px;padding:9px;cursor:pointer}.list{display:grid;gap:12px}.line{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:16px;background:rgba(26,46,40,.55)}.line img{width:84px;height:94px;object-fit:cover;border-radius:10px}.line-main{flex:1;min-width:0}.line-main strong{display:block}.muted{color:var(--muted);font-size:12px}.qty{display:flex;align-items:center;gap:12px;margin-top:10px}.qty button{border:1px solid var(--line);border-radius:8px;background:transparent;color:white;padding:3px 11px}.summary{margin:22px 0 0 auto;max-width:420px;border:1px solid var(--line);border-radius:16px;padding:20px;background:#0b2118}.sumrow{display:flex;justify-content:space-between;margin-bottom:14px}.total{font-size:22px;font-weight:800;color:var(--gold)}.empty{padding:38px 20px;border:1px dashed var(--line);border-radius:18px;text-align:center}.empty p{color:var(--muted)}.empty a{display:inline-block;margin-top:8px}.formbox{max-width:500px;border:1px solid var(--line);border-radius:18px;padding:22px;background:rgba(26,46,40,.55)}.formbox label{display:grid;gap:7px;margin:14px 0;color:var(--muted);font-size:13px}.formbox input{width:100%;background:#10271f;color:white;border:1px solid var(--line);border-radius:11px;padding:13px}.notice{color:var(--muted);font-size:12px;margin-top:15px}.footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:12px}.mobile-nav{display:none}
@media(max-width:760px){.wrap{width:calc(100% - 24px)}.head{height:62px;gap:10px}.brand img{width:46px;height:46px}.nav{display:none}.head-actions{margin-left:auto;gap:5px}.head-actions a{padding:8px;font-size:10px}main{padding:25px 0 35px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.pinfo{padding:9px}.name{font-size:12px}.line{gap:10px;padding:10px}.line img{width:68px;height:78px}.line-main strong{font-size:12px}.line .btn{padding:8px;font-size:11px}.summary{max-width:none}.mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 3px calc(8px + env(safe-area-inset-bottom));background:rgba(5,20,16,.97);border-top:1px solid var(--line);backdrop-filter:blur(18px)}.mobile-nav a{text-align:center;color:var(--muted);font-size:9px}.mobile-nav a.active{color:var(--neon)}.mobile-nav span{display:block;font-size:18px;line-height:1.3}.footer{font-size:11px}}
</style></head><body>
<header class="header"><div class="wrap head"><a class="brand" href="index.html" aria-label="ТИК — главная"><img src="https://i.ibb.co/fd99r06X/TIK-logo-transparent.png" alt="ТИК"></a><nav class="nav"><a href="index.html">Главная</a><a href="catalog.html" data-nav="catalog">Каталог</a><a href="favorites.html" data-nav="favorites">Избранное</a><a href="cart.html" data-nav="cart">Корзина</a><a href="account.html" data-nav="account">Личный кабинет</a></nav><div class="head-actions"><a href="favorites.html" data-nav="favorites">♡ <span id="favCount">0</span></a><a href="cart.html" data-nav="cart">Корзина <span id="cartCount">0</span></a></div></div></header>
<main class="wrap"><h1>Избранное</h1><p class="intro">Товары, которые ты сохранил, собраны в одном месте.</p><div id="pageContent"></div></main>
<footer class="footer"><div class="wrap">ТИК ©2026 Все права защищены</div></footer>
<nav class="mobile-nav"><a href="index.html"><span>⌂</span>Главная</a><a href="catalog.html" data-nav="catalog"><span>▦</span>Каталог</a><a href="favorites.html" data-nav="favorites"><span>♡</span>Избранное</a><a href="cart.html" data-nav="cart"><span>🛒</span>Корзина</a><a href="account.html" data-nav="account"><span>♙</span>Профиль</a></nav>
<script>
const products=[
{id:1,name:'Наушники Studio One',cat:'Технологии',price:4990,old:6290,tag:'ХИТ',rating:'4.9',reviews:128,img:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=700&q=85'},
{id:2,name:'Часы Minimal Form',cat:'Аксессуары',price:3290,old:4190,tag:'ВЫБОР ТИК',rating:'4.8',reviews:86,img:'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=700&q=85'},
{id:3,name:'Рюкзак Everyday',cat:'Стиль',price:2790,old:0,tag:'НОВИНКА',rating:'4.9',reviews:54,img:'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=700&q=85'},
{id:4,name:'Настольная лампа Aura',cat:'Дом',price:2190,old:2690,tag:'-18%',rating:'4.7',reviews:42,img:'https://images.unsplash.com/photo-150 LED' .replace('https://images.unsplash.com/photo-150 LED','https://images.unsplash.com/photo-1507473885765-e6ed057f782c')+'?auto=format&fit=crop&w=700&q=85'},
{id:5,name:'Кроссовки City Move',cat:'Стиль',price:5890,old:6990,tag:'НОВИНКА',rating:'4.8',reviews:73,img:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=700&q=85'},
{id:6,name:'Колонка Sound Mini',cat:'Технологии',price:3690,old:0,tag:'ВЫБОР ТИК',rating:'4.8',reviews:91,img:'https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=700&q=85'},
{id:7,name:'Очки Urban Shade',cat:'Аксессуары',price:1590,old:1990,tag:'-20%',rating:'4.6',reviews:36,img:'https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=700&q=85'},
{id:8,name:'Керамическая ваза Form',cat:'Дом',price:1290,old:0,tag:'НОВИНКА',rating:'4.9',reviews:28,img:'https://images.unsplash.com/photo-1578500494198-246f612d3b3d?auto=format&fit=crop&w=700&q=85'}];
const keyCart='tik_cart_v1',keyFav='tik_favs_v1';
const read=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v??d}catch(e){return d}};
let cart=new Map(read(keyCart,[]).filter(x=>Array.isArray(x)).map(([id,n])=>[+id,+n]));
let favs=new Set(read(keyFav,[]).map(Number));
const money=n=>n.toLocaleString('ru-RU')+' ₽';
const save=()=>{localStorage.setItem(keyCart,JSON.stringify([...cart]));localStorage.setItem(keyFav,JSON.stringify([...favs]));counts()};
function counts(){document.querySelectorAll('#cartCount').forEach(x=>x.textContent=[...cart.values()].reduce((a,b)=>a+b,0));document.querySelectorAll('#favCount').forEach(x=>x.textContent=favs.size)}
const page=document.body.dataset.page;
document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===page)a.classList.add('active')});
function productCard(p){return '<article class="product"><img loading="lazy" src="'+p.img+'" alt="'+p.name+'"><div class="pinfo"><div class="cat">'+p.cat+'</div><div class="name">'+p.name+'</div><div class="price">'+money(p.price)+'</div><div class="row"><button class="btn" data-add="'+p.id+'">В корзину</button><button class="heart" data-fav="'+p.id+'" aria-label="Избранное">'+(favs.has(p.id)?'♥':'♡')+'</button></div></div></article>'}
function bind(){document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const id=+b.dataset.add;cart.set(id,(cart.get(id)||0)+1);save();if(page==='cart')render();else{b.textContent='Добавлено ✓';setTimeout(()=>b.textContent='В корзину',900)}});document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const id=+b.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);save();render()});}
function render(){
const host=document.getElementById('pageContent');
if(page==='catalog'){
host.innerHTML='<div class="toolbar"><input id="q" placeholder="Найти товар…"><select id="cat"><option value="">Все категории</option>'+[...new Set(products.map(p=>p.cat))].map(c=>'<option>'+c+'</option>').join('')+'</select><select id="sort"><option value="default">Рекомендуемые</option><option value="asc">Сначала дешевле</option><option value="desc">Сначала дороже</option></select></div><div class="grid" id="products"></div>';
const update=()=>{let list=products.filter(p=>(p.name+' '+p.cat).toLowerCase().includes(document.getElementById('q').value.toLowerCase())&&(!document.getElementById('cat').value||p.cat===document.getElementById('cat').value));if(document.getElementById('sort').value==='asc')list.sort((a,b)=>a.price-b.price);if(document.getElementById('sort').value==='desc')list.sort((a,b)=>b.price-a.price);document.getElementById('products').innerHTML=list.length?list.map(productCard).join(''):'<div class="empty">Товары не найдены</div>';bind()};['q','cat','sort'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',update));update();return;
}
if(page==='favorites'){
const items=products.filter(p=>favs.has(p.id));host.innerHTML=items.length?'<div class="grid">'+items.map(productCard).join('')+'</div>':'<div class="empty"><h2>В избранном пока пусто</h2><p>Нажимай на сердечко у товаров, чтобы сохранить их здесь.</p><a class="btn" href="catalog.html">Перейти в каталог</a></div>';bind();return;
}
if(page==='cart'){
const items=[...cart.entries()].map(([id,n])=>({p:products.find(p=>p.id===id),n})).filter(x=>x.p&&x.n>0);
if(!items.length){host.innerHTML='<div class="empty"><h2>Корзина пока пуста</h2><p>Добавь товары из каталога — они появятся здесь.</p><a class="btn" href="catalog.html">Перейти в каталог</a></div>';return}
const total=items.reduce((sum,x)=>sum+x.p.price*x.n,0);
host.innerHTML='<div class="list">'+items.map(({p,n})=>'<article class="line"><img src="'+p.img+'" alt="'+p.name+'"><div class="line-main"><strong>'+p.name+'</strong><div class="muted">'+money(p.price)+' за шт.</div><div class="qty"><button data-dec="'+p.id+'">−</button><b>'+n+'</b><button data-inc="'+p.id+'">+</button></div></div><div><strong>'+money(p.price*n)+'</strong><br><button class="btn danger" data-remove="'+p.id+'">Удалить</button></div></article>').join('')+'</div><div class="summary"><div class="sumrow"><span>Товаров</span><b>'+items.reduce((a,x)=>a+x.n,0)+' шт.</b></div><div class="sumrow"><span>Итого</span><strong class="total">'+money(total)+'</strong></div><button class="btn" id="checkout">Перейти к оформлению</button><p class="notice">Оформление заказа и онлайн-оплата пока не подключены.</p></div>';
host.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{const id=+b.dataset.inc;cart.set(id,cart.get(id)+1);save();render()});host.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const id=+b.dataset.dec;const n=cart.get(id)-1;if(n<=0)cart.delete(id);else cart.set(id,n);save();render()});host.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart.delete(+b.dataset.remove);save();render()});document.getElementById('checkout').onclick=()=>alert('Оформление заказа подключим после настройки сервера и оплаты.');return;
}
if(page==='account'){host.innerHTML='<div class="formbox"><h2>Войти или создать аккаунт</h2><p class="muted">Форма подготовлена для будущей авторизации.</p><form id="loginForm"><label>Электронная почта<input type="email" required placeholder="name@example.com"></label><label>Пароль<input type="password" required minlength="6" placeholder="Не менее 6 символов"></label><button class="btn" type="submit">Продолжить</button></form><p class="notice">Настоящий вход и регистрация пока не подключены. Не вводи здесь реальный пароль: форма демонстрационная.</p></div>';document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();alert('Авторизация пока не подключена.');};}
}
document.body.dataset.page='favorites';counts();render();
</script></body></html>
